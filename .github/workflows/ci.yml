name: Node.js CI

on:
  push:

  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    env:
      PORT: 5000
      JWT_SECRET: testsecret
      MONGO_URI: mongodb://localhost:27017/api-subledger-test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: npm test